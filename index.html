<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Instagram複合施策 PRシミュレーション | GOOD VIBES AGENCY</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2557;--navy2:#1b3a7a;--gold:#b8860b;--gold2:#d4a017;
  --green:#15803d;--red:#b91c1c;--blue:#1d4ed8;--orange:#c2410c;
  --gray:#64748b;--lightgray:#f1f4f9;--border:#dde3ef;--text:#1a1f2e;
}
body{font-family:'Noto Sans JP',sans-serif;background:#f0f2f6;color:var(--text);font-size:14px;min-height:100vh}
button{cursor:pointer;font-family:'Noto Sans JP',sans-serif}
table{border-collapse:collapse;width:100%}

/* ── ヘッダー ── */
#hdr{background:var(--navy);color:#fff;padding:20px 32px;border-bottom:4px solid var(--gold)}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hdr-label{font-size:10px;letter-spacing:.2em;color:#8aaad8;margin-bottom:6px;font-weight:500}
.hdr-title{font-size:20px;font-weight:900;line-height:1.3}
.hdr-sub{font-size:11px;color:#7a9dc8;margin-top:6px;line-height:1.6}
.hdr-right{text-align:right;flex-shrink:0}
.hdr-date{font-size:11px;color:#8aaad8;margin-bottom:6px}
.badge-conf{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:3px 12px;letter-spacing:.08em;display:inline-block}

/* ── 予算バー ── */
#budgetbar{background:#f0f4ff;border-bottom:2px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bgt-lbl{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap}
.bgt-btn{padding:8px 24px;font-size:13px;font-weight:700;border:2px solid #b0bcd4;background:#fff;color:var(--navy);border-radius:4px;transition:all .15s}
.bgt-btn.on{border-color:var(--navy);background:var(--navy);color:#fff}
.bgt-summary{margin-left:auto;font-size:12px;color:var(--gray)}
.bgt-summary strong{color:var(--navy);font-size:14px}

/* ── タブ ── */
#tabbar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 32px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#tabbar::-webkit-scrollbar{display:none}
.tab-btn{padding:14px 20px;font-size:12px;font-weight:600;background:none;border:none;color:var(--gray);border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .15s}
.tab-btn.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ── メイン ── */
#main{padding:28px 32px;max-width:1080px;margin:0 auto}
.section{margin-bottom:28px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-no{font-size:22px;font-weight:900;color:var(--gold);line-height:1;min-width:36px}
.sec-title{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.06em;border-bottom:2px solid var(--navy);padding-bottom:6px;flex:1}

/* ── カード ── */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.08);padding:22px 24px}
.card-ttl{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi-grid-6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.08);padding:16px 18px;border-top:3px solid var(--ac,var(--navy))}
.kpi-lbl{font-size:10px;color:var(--gray);font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:900;color:var(--ac,var(--navy));line-height:1}
.kpi-sub{font-size:10px;color:#9aa5be;margin-top:5px;line-height:1.5}

/* ── テーブル ── */
.tbl-wrap{overflow-x:auto;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.08)}
.dtbl th{background:var(--navy);color:#fff;padding:10px 14px;font-size:11px;font-weight:700;text-align:right;white-space:nowrap;border-right:1px solid var(--navy2)}
.dtbl th.L{text-align:left}
.dtbl td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);border-right:1px solid #eef0f6;text-align:right;background:#fff}
.dtbl td.L{text-align:left}
.dtbl tr:nth-child(even) td{background:#f8f9fd}
.dtbl tr:hover td{background:#eef2ff}
.dtbl .total-row td{background:#e4e9f5;font-weight:700;font-size:13px;color:var(--navy)}

/* ── 配分バー ── */
.alloc-bar-wrap{margin:12px 0 6px;height:10px;border-radius:5px;overflow:hidden;background:#e4e9f5;display:flex}
.alloc-bar-a{background:var(--gold2);transition:width .4s ease}
.alloc-bar-b{background:#15803d;flex:1}
.alloc-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);margin-bottom:12px}

/* ── メニュー行 ── */
.menu-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.menu-row:first-child{border-top:1px solid var(--border)}
.menu-left{display:flex;align-items:center;gap:8px}
.menu-dot{width:10px;height:10px;border-radius:50%}
.menu-name{font-size:13px;font-weight:600;color:var(--text)}
.menu-detail{font-size:11px;color:var(--gray);margin-top:2px}
.menu-right{text-align:right}
.menu-cost{font-size:15px;font-weight:700;color:var(--text)}
.menu-pct{font-size:11px;color:var(--gray)}

/* ── グリッド ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* ── インフォボックス ── */
.info-box{background:#f0f4ff;border-left:5px solid var(--navy);border-radius:0 8px 8px 0;padding:18px 22px}
.warn-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:14px 18px;font-size:11px;color:#78350f;line-height:1.8}
.green-box{background:#f0fdf4;border-left:5px solid var(--green);border-radius:0 8px 8px 0;padding:14px 18px;font-size:12px;color:#14532d;line-height:1.8}

/* ── タグ ── */
.tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;vertical-align:middle}
.tag-reel{background:#fef3c7;color:#92400e}
.tag-feed{background:#dcfce7;color:#14532d}
.tag-rec{background:var(--navy);color:#fff}
.tag-max{background:#7c3aed;color:#fff}

/* ── 比較テーブル ── */
.cmp th{background:var(--navy);color:#fff;padding:10px 14px;font-size:11px;font-weight:700;text-align:center;border-right:1px solid var(--navy2)}
.cmp th.L{text-align:left}
.cmp th.hl{background:var(--gold);color:#fff}
.cmp td{padding:10px 14px;font-size:12px;border-bottom:1px solid var(--border);text-align:center;background:#fff}
.cmp td.L{text-align:left;color:var(--gray)}
.cmp td.hl{background:#fffbeb;font-weight:700;color:var(--gold)}
.cmp .check{color:var(--green);font-size:16px;font-weight:900}
.cmp .cross{color:#d1d5db;font-size:14px}
.cmp tr:hover td{background:#f8f9fd}

/* ── 実績カード ── */
.case-card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.08);padding:22px 24px;border-top:3px solid var(--ac,var(--navy))}
.case-type{font-size:10px;letter-spacing:.15em;color:var(--gray);margin-bottom:8px;font-weight:600}
.case-ttl{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:4px}
.case-sub{font-size:11px;color:var(--gray);margin-bottom:16px}
.case-nums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.case-num-val{font-size:28px;font-weight:900;color:var(--gold);line-height:1}
.case-num-lbl{font-size:10px;color:var(--gray);margin-top:3px;line-height:1.5}

/* ── フロー ── */
.flow-row{display:flex;align-items:flex-start;gap:0}
.flow-step{flex:1;text-align:center;position:relative;padding:0 8px}
.flow-step::after{content:'→';position:absolute;right:-8px;top:16px;font-size:16px;color:#b0bcd4;font-weight:700}
.flow-step:last-child::after{display:none}
.flow-no{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.flow-ttl{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.flow-txt{font-size:10px;color:var(--gray);line-height:1.7}
.flow-time{font-size:10px;color:var(--gold);font-weight:700;margin-top:4px}

/* ── ユーティリティ ── */
.pos{color:var(--green)} .neg{color:var(--red)}
.bold{font-weight:700}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.text-right{text-align:right}
.text-center{text-align:center}

/* ── レスポンシブ ── */
@media(max-width:768px){
  #hdr{padding:16px}
  .hdr-top{flex-direction:column;gap:8px}
  .hdr-right{text-align:left}
  .hdr-title{font-size:16px}
  #budgetbar{padding:10px 16px;gap:6px}
  .bgt-btn{padding:6px 14px;font-size:12px}
  .bgt-summary{display:none}
  #tabbar{padding:0 16px}
  .tab-btn{padding:12px 10px;font-size:11px}
  #main{padding:16px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi-grid-6{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .flow-row{flex-direction:column;gap:12px}
  .flow-step::after{display:none}
}
</style>
</head>
<body>

<!-- ヘッダー -->
<div id="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-label">株式会社 GOOD VIBES AGENCY　|　クライアント向け提案資料</div>
      <div class="hdr-title">Instagram複合施策 PRシミュレーション</div>
      <div class="hdr-sub">① インフルエンサーリール × ② ナノUGCフィード口コミ　複合プラン<br>
      FW単価 ¥2.0〜／ナノUGC ¥5,600/名　※Instagramのみ・最大150名稼働</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-date" id="hdr-date"></div>
      <div class="badge-conf">CONFIDENTIAL</div>
    </div>
  </div>
</div>

<!-- 予算セレクター -->
<div id="budgetbar">
  <span class="bgt-lbl">💰 月額予算：</span>
  <button class="bgt-btn" data-bgt="500">¥50万円</button>
  <button class="bgt-btn" data-bgt="1000">¥100万円</button>
  <button class="bgt-btn" data-bgt="1500">¥150万円</button>
  <span class="bgt-summary" id="bgt-summary"></span>
</div>

<!-- タブ -->
<div id="tabbar">
  <button class="tab-btn" data-tab="sim">シミュレーション</button>
  <button class="tab-btn" data-tab="menu">メニュー詳細</button>
  <button class="tab-btn" data-tab="result">実績・事例</button>
  <button class="tab-btn" data-tab="compare">他社比較</button>
  <button class="tab-btn" data-tab="flow">依頼の流れ</button>
</div>

<!-- メインコンテンツ -->
<div id="main"></div>

<!-- フッター -->
<div style="padding:14px 32px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:10px;color:#9aa5be;margin-top:8px">
  <span>株式会社 GOOD VIBES AGENCY　|　Instagram複合施策 PRシミュレーション</span>
  <span>本資料の推定数値は過去実績に基づく参考値です。効果を保証するものではありません。商品ギフティングコストは別途。</span>
</div>

<script>
// ── データ定義 ──
const MENU = {
  reel: { unitCost: 70000, avgFw: 35000, fwRate: 2.0, impPerPerson: 100000 },
  ugc:  { unitCost:  5600, avgFw:  4000, impPerPerson:  20000 },
};

const BUDGETS = {
  500:  { reel: 2,  ugc:  64, reelCost: 140000, ugcCost: 358400  },
  1000: { reel: 5,  ugc: 116, reelCost: 350000, ugcCost: 649600  },
  1500: { reel: 10, ugc: 140, reelCost: 700000, ugcCost: 784000  },
};

let state = { bgt: 1000, tab: 'sim' };

// ── 計算 ──
function calc(bgt) {
  const d = BUDGETS[bgt];
  const totalPeople = d.reel + d.ugc;
  const totalCost   = d.reelCost + d.ugcCost;
  const totalImp    = d.reel * MENU.reel.impPerPerson + d.ugc * MENU.ugc.impPerPerson;
  const cpm         = Math.round(totalCost / totalImp * 1000);
  const reelPct     = Math.round(d.reelCost / totalCost * 100);
  const ugcPct      = 100 - reelPct;
  const ugcAssets   = totalPeople;
  const costPerPerson = Math.round(totalCost / totalPeople);
  return { ...d, totalPeople, totalCost, totalImp, cpm, reelPct, ugcPct, ugcAssets, costPerPerson };
}

const fYen  = v => `¥${(v / 10000).toFixed(1)}万`;
const fYenK = v => `¥${v.toLocaleString()}`;
const fImp  = v => v >= 10000 ? `${(v/10000).toFixed(0)}万` : v.toLocaleString();
const fM    = v => v >= 10000 ? `${(v/10000).toFixed(1)}万` : v.toLocaleString();

// ── タブ: シミュレーション ──
function tSim() {
  const b = state.bgt;
  const c = calc(b);
  const isMax = b === 1500;
  const isRec = b === 1000;

  return `
  <div class="section">
    <div class="sec-head"><div class="sec-no">01</div><div class="sec-title">予算配分内訳</div></div>
    <div class="g2">
      <div class="card">
        <div class="card-ttl">メニュー別 配分</div>

        <div class="menu-row">
          <div class="menu-left">
            <div class="menu-dot" style="background:var(--gold2)"></div>
            <div>
              <div class="menu-name">① インフルエンサーリール <span class="tag tag-reel">REEL</span></div>
              <div class="menu-detail">${c.reel}名 × ¥70,000（FW avg 35,000人・FW単価¥2）</div>
            </div>
          </div>
          <div class="menu-right">
            <div class="menu-cost">${fYenK(c.reelCost)}</div>
            <div class="menu-pct">${c.reelPct}%</div>
          </div>
        </div>

        <div class="menu-row">
          <div class="menu-left">
            <div class="menu-dot" style="background:var(--green)"></div>
            <div>
              <div class="menu-name">② UGC フィードカルーセル <span class="tag tag-feed">FEED</span></div>
              <div class="menu-detail">${c.ugc}名 × ¥5,600（ナノインフルエンサー）</div>
            </div>
          </div>
          <div class="menu-right">
            <div class="menu-cost">${fYenK(c.ugcCost)}</div>
            <div class="menu-pct">${c.ugcPct}%</div>
          </div>
        </div>

        <div class="alloc-bar-wrap">
          <div class="alloc-bar-a" style="width:${c.reelPct}%"></div>
          <div class="alloc-bar-b"></div>
        </div>
        <div class="alloc-legend">
          <span>① リール ${c.reelPct}%</span>
          <span>② UGC ${c.ugcPct}%</span>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;border-top:2px solid var(--border)">
          <span style="font-size:12px;color:var(--gray)">合計</span>
          <span style="font-size:22px;font-weight:900;color:var(--navy)">${fYenK(c.totalCost)}</span>
        </div>
      </div>

      <div class="card">
        <div class="card-ttl">ポイント</div>
        <div class="info-box" style="margin-bottom:12px">
          <p style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px">
            ${isMax ? '🔥 MAX稼働プラン — ネットワーク全力投入' : isRec ? '⭐ 推奨プラン — ROI最大化バランス型' : '✅ テスト導入プラン — リスク最小で効果検証'}
          </p>
          <p style="font-size:12px;color:#374151;line-height:1.9">
            ${isMax
              ? 'GVAナノネットワーク150名フル稼働。インフルエンサー10名のリールで認知を爆発させ、140名のUGCカルーセルでInstagram検索口コミを量産。UGC素材150点は広告素材としても転用可能。'
              : isRec
              ? 'インフルエンサー5名の認知リールと116名のナノUGCを組み合わせた最もROIが高い構成。広告との並走でCVRブーストに最適。継続運用で口コミが蓄積され複利的に効果が増大。'
              : '2名のインフルエンサーリールと64名のナノUGCで、まず1ヶ月の効果を検証。コストを抑えながらリール×UGC複合設計の拡散・口コミ効果を確認できる導入パターン。'
            }
          </p>
        </div>
        <div class="warn-box">
          📌 インフルエンサーFW数・カテゴリにより単価は変動します。FW単価¥2×平均FW35,000人での試算。<br>
          商品ギフティングコストは別途ご負担ください。
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-head"><div class="sec-no">02</div><div class="sec-title">主要KPI</div></div>
    <div class="kpi-grid">
      <div class="kpi" style="--ac:var(--navy)">
        <div class="kpi-lbl">TOTAL 稼働人数</div>
        <div class="kpi-val">${c.totalPeople}<small style="font-size:16px;font-weight:600">名</small>${isMax ? ' <span class="tag tag-max">MAX</span>' : ''}</div>
        <div class="kpi-sub">① ${c.reel}名 ＋ ② ${c.ugc}名</div>
      </div>
      <div class="kpi" style="--ac:var(--gold)">
        <div class="kpi-lbl">推定インプレッション</div>
        <div class="kpi-val">${fImp(c.totalImp)}<small style="font-size:16px;font-weight:600">imp</small></div>
        <div class="kpi-sub">① ${fImp(c.reel * MENU.reel.impPerPerson)} ＋ ② ${fImp(c.ugc * MENU.ugc.impPerPerson)}</div>
      </div>
      <div class="kpi" style="--ac:var(--green)">
        <div class="kpi-lbl">CPM（参考）</div>
        <div class="kpi-val">¥${c.cpm}</div>
        <div class="kpi-sub">Meta広告 ¥500〜2,000 比</div>
      </div>
      <div class="kpi" style="--ac:var(--blue)">
        <div class="kpi-lbl">UGC素材獲得数</div>
        <div class="kpi-val">${c.ugcAssets}<small style="font-size:16px;font-weight:600">点</small></div>
        <div class="kpi-sub">広告・EC転用可能</div>
      </div>
    </div>
    <div class="kpi-grid-6" style="margin-top:12px">
      <div class="kpi" style="--ac:var(--navy)">
        <div class="kpi-lbl">投稿本数合計</div>
        <div class="kpi-val">${c.totalPeople}<small style="font-size:16px;font-weight:600">本</small></div>
        <div class="kpi-sub">リール${c.reel}本 ＋ フィード${c.ugc}本</div>
      </div>
      <div class="kpi" style="--ac:var(--gray)">
        <div class="kpi-lbl">1名あたりコスト</div>
        <div class="kpi-val">¥${c.costPerPerson.toLocaleString()}</div>
        <div class="kpi-sub">管理費・ディレクション込み</div>
      </div>
      <div class="kpi" style="--ac:var(--orange)">
        <div class="kpi-lbl">リール 推定リーチ</div>
        <div class="kpi-val">${fImp(c.reel * MENU.reel.impPerPerson)}</div>
        <div class="kpi-sub">${c.reel}名 × avg 100,000 imp</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-head"><div class="sec-no">03</div><div class="sec-title">3パターン 早見表</div></div>
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead>
          <tr>
            <th class="L" style="min-width:100px">プラン</th>
            <th>①リール人数</th>
            <th>②UGC人数</th>
            <th>合計人数</th>
            <th>①費用</th>
            <th>②費用</th>
            <th>合計費用</th>
            <th>推定imp</th>
            <th>CPM</th>
            <th>UGC素材</th>
          </tr>
        </thead>
        <tbody>
          ${[500, 1000, 1500].map(bg => {
            const cc = calc(bg);
            const isThis = bg === b;

// ── 描画 ──
function render() {
  const main = document.getElementById('main');
  const fns = { sim: tSim, menu: tMenu, result: tResult, compare: tCompare, flow: tFlow };
  main.innerHTML = (fns[state.tab] || tSim)();
}

function updateBgtSummary() {
  const c = calc(state.bgt);
  const el = document.getElementById('bgt-summary');
  if (el) {
    el.innerHTML = `選択中：<strong>¥${state.bgt/10}万円</strong>　合計 <strong>${c.totalPeople}名</strong>　推定 <strong>${fImp(c.totalImp)}imp</strong>`;
  }
}

function init() {
  // 日付
  const d = new Date();
  const fmt = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  document.getElementById('hdr-date').textContent = fmt;

  // 予算ボタン
  document.querySelectorAll('.bgt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.bgt = +btn.dataset.bgt;
      document.querySelectorAll('.bgt-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      updateBgtSummary();
      if (state.tab === 'sim') render();
    });
    if (+btn.dataset.bgt === state.bgt) btn.classList.add('on');
  });

  // タブ
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      render();
    });
    if (btn.dataset.tab === state.tab) btn.classList.add('on');
  });

  updateBgtSummary();
  render();
}

init();
