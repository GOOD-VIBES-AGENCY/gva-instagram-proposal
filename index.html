<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Instagram複合施策 PRシミュレーション | GOOD VIBES AGENCY</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2557;--navy2:#1b3a7a;--gold:#b8860b;--gold2:#d4a017;
  --green:#15803d;--red:#b91c1c;--blue:#1d4ed8;--orange:#c2410c;
  --purple:#6d28d9;--gray:#64748b;--border:#dde3ef;--text:#1a1f2e;
  --bg:#f0f2f6;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
button{cursor:pointer;font-family:'Noto Sans JP',sans-serif}
table{border-collapse:collapse;width:100%}
canvas{display:block}

/* ── ヘッダー ── */
#hdr{background:var(--navy);color:#fff;padding:20px 32px;border-bottom:4px solid var(--gold)}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hdr-label{font-size:10px;letter-spacing:.2em;color:#8aaad8;margin-bottom:6px;font-weight:500}
.hdr-title{font-size:20px;font-weight:900;line-height:1.3}
.hdr-sub{font-size:11px;color:#7a9dc8;margin-top:6px;line-height:1.6}
.hdr-right{text-align:right;flex-shrink:0}
.hdr-date{font-size:11px;color:#8aaad8;margin-bottom:6px}
.badge-conf{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:3px 12px;letter-spacing:.08em;display:inline-block}

/* ── 予算バー ── */
#budgetbar{background:#e8edf8;border-bottom:2px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bgt-lbl{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap}
.bgt-btn{padding:8px 24px;font-size:13px;font-weight:700;border:2px solid #b0bcd4;background:#fff;color:var(--navy);border-radius:4px;transition:all .2s}
.bgt-btn.on{border-color:var(--navy);background:var(--navy);color:#fff}
.bgt-summary{margin-left:auto;font-size:12px;color:var(--gray)}
.bgt-summary strong{color:var(--navy);font-size:14px}

/* ── タブ ── */
#tabbar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 32px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#tabbar::-webkit-scrollbar{display:none}
.tab-btn{padding:14px 20px;font-size:12px;font-weight:600;background:none;border:none;color:var(--gray);border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .15s}
.tab-btn.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ── メイン ── */
#main{padding:28px 32px;max-width:1080px;margin:0 auto}
.section{margin-bottom:32px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-no{font-size:22px;font-weight:900;color:var(--gold);line-height:1;min-width:36px}
.sec-title{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.06em;border-bottom:2px solid var(--navy);padding-bottom:6px;flex:1}

/* ── カード ── */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.09);padding:22px 24px}
.card-ttl{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.09);padding:16px 18px;border-top:3px solid var(--ac,var(--navy));transition:transform .2s}
.kpi:hover{transform:translateY(-2px)}
.kpi-lbl{font-size:10px;color:var(--gray);font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:900;color:var(--ac,var(--navy));line-height:1;transition:all .4s}
.kpi-sub{font-size:10px;color:#9aa5be;margin-top:5px;line-height:1.5}

/* ── チャートラッパー ── */
.chart-wrap{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.09);padding:20px 24px}
.chart-ttl{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.chart-inner{position:relative}

/* ── テーブル ── */
.tbl-wrap{overflow-x:auto;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.09)}
.dtbl th{background:var(--navy);color:#fff;padding:10px 14px;font-size:11px;font-weight:700;text-align:right;white-space:nowrap;border-right:1px solid var(--navy2)}
.dtbl th.L{text-align:left}
.dtbl td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);border-right:1px solid #eef0f6;text-align:right;background:#fff}
.dtbl td.L{text-align:left}
.dtbl tr:nth-child(even) td{background:#f8f9fd}
.dtbl tr:hover td{background:#eef2ff}
.dtbl .total-row td{background:#e4e9f5;font-weight:700;font-size:13px;color:var(--navy)}
.dtbl .hl-row td{background:#fffbeb;font-weight:700}

/* ── 配分バー ── */
.alloc-bar-wrap{margin:12px 0 6px;height:10px;border-radius:5px;overflow:hidden;background:#e4e9f5;display:flex}
.alloc-bar-a{background:var(--gold2);transition:width .5s ease}
.alloc-bar-b{background:var(--green);flex:1}
.alloc-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);margin-bottom:12px}

/* ── メニュー行 ── */
.menu-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.menu-row:first-child{border-top:1px solid var(--border)}
.menu-left{display:flex;align-items:center;gap:8px}
.menu-dot{width:10px;height:10px;border-radius:50%}
.menu-name{font-size:13px;font-weight:600;color:var(--text)}
.menu-detail{font-size:11px;color:var(--gray);margin-top:2px}
.menu-right{text-align:right}
.menu-cost{font-size:15px;font-weight:700;color:var(--text)}
.menu-pct{font-size:11px;color:var(--gray)}

/* ── グリッド ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.g12{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}

/* ── ボックス ── */
.info-box{background:#f0f4ff;border-left:5px solid var(--navy);border-radius:0 8px 8px 0;padding:16px 20px}
.warn-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:12px 16px;font-size:11px;color:#78350f;line-height:1.8}
.green-box{background:#f0fdf4;border-left:5px solid var(--green);border-radius:0 8px 8px 0;padding:14px 18px;font-size:12px;color:#14532d;line-height:1.8}
.gold-box{background:#fffbeb;border-left:5px solid var(--gold);border-radius:0 8px 8px 0;padding:14px 18px;font-size:12px;line-height:1.8}

/* ── タグ ── */
.tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;vertical-align:middle;margin-left:4px}
.tag-reel{background:#fef3c7;color:#92400e}
.tag-feed{background:#dcfce7;color:#14532d}
.tag-rec{background:var(--navy);color:#fff}
.tag-max{background:#7c3aed;color:#fff}
.tag-new{background:#ef4444;color:#fff}

/* ── ファネル ── */
.funnel{display:flex;flex-direction:column;gap:0;align-items:center;padding:20px 0}
.funnel-step{width:100%;padding:12px 20px;text-align:center;position:relative;transition:all .2s}
.funnel-step:hover{filter:brightness(1.05)}
.funnel-label{font-size:12px;font-weight:700;color:#fff}
.funnel-sub{font-size:10px;color:rgba(255,255,255,.8);margin-top:2px}
.funnel-arrow{text-align:center;font-size:18px;color:#b0bcd4;line-height:1.2;margin:2px 0}

/* ── KPI表 ── */
.kpi-tbl th{background:#f1f4f9;color:var(--navy);padding:9px 14px;font-size:11px;font-weight:700;text-align:left;border-bottom:2px solid var(--border)}
.kpi-tbl td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:top}
.kpi-tbl tr:hover td{background:#fafbff}

/* ── フロー ── */
.flow-row{display:flex;align-items:flex-start;gap:0}
.flow-step{flex:1;text-align:center;position:relative;padding:0 8px}
.flow-step::after{content:'→';position:absolute;right:-8px;top:16px;font-size:16px;color:#b0bcd4;font-weight:700}
.flow-step:last-child::after{display:none}
.flow-no{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.flow-ttl{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.flow-txt{font-size:10px;color:var(--gray);line-height:1.7}
.flow-time{font-size:10px;color:var(--gold);font-weight:700;margin-top:4px}

/* ── 実績 ── */
.case-card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(15,37,87,.09);padding:22px 24px;border-top:3px solid var(--ac,var(--navy))}
.case-type{font-size:10px;letter-spacing:.15em;color:var(--gray);margin-bottom:8px;font-weight:600}
.case-ttl{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:4px}
.case-sub{font-size:11px;color:var(--gray);margin-bottom:16px}
.case-nums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.case-num-val{font-size:28px;font-weight:900;color:var(--gold);line-height:1}
.case-num-lbl{font-size:10px;color:var(--gray);margin-top:3px;line-height:1.5}

/* ── 比較 ── */
.cmp th{background:var(--navy);color:#fff;padding:10px 14px;font-size:11px;font-weight:700;text-align:center;border-right:1px solid var(--navy2)}
.cmp th.L{text-align:left}
.cmp th.hl{background:var(--gold)}
.cmp td{padding:10px 14px;font-size:12px;border-bottom:1px solid var(--border);text-align:center;background:#fff}
.cmp td.L{text-align:left;color:var(--gray)}
.cmp td.hl{background:#fffbeb;font-weight:700;color:var(--gold)}
.cmp .check{color:var(--green);font-weight:900}
.cmp .cross{color:#d1d5db}
.cmp tr:hover td{background:#f8f9fd}

/* ── アニメーション ── */
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .4s ease forwards}
.kpi-val.updating{animation:countUp .35s ease}

/* ── レスポンシブ ── */
@media(max-width:768px){
  #hdr,#budgetbar,#main{padding-left:16px;padding-right:16px}
  .hdr-top{flex-direction:column;gap:8px}
  .hdr-right{text-align:left}
  .hdr-title{font-size:16px}
  .bgt-btn{padding:6px 14px;font-size:12px}
  .bgt-summary{display:none}
  #tabbar{padding:0 16px}
  .tab-btn{padding:12px 10px;font-size:11px}
  #main{padding:16px}
  .kpi-grid,.kpi-grid-3{grid-template-columns:1fr 1fr}
  .g2,.g3,.g12{grid-template-columns:1fr}
  .flow-row{flex-direction:column;gap:12px}
  .flow-step::after{display:none}
}
</style>
</head>

<script>
// ───────────────────────────
// データ定義
// ───────────────────────────
const REEL_UNIT  = 70000; // ¥/名（FW avg 35,000人 × ¥2/FW）
const UGC_UNIT   =  5600; // ¥/名（名目単価）
const REEL_IMP   = 100000;
const UGC_IMP    =  20000;
const MAX_PEOPLE = 150;

// 予算キー → リール人数のみ定義。残額は全てUGCへ充当し合計=予算ぴったり
const REEL_COUNT = { 500:2, 1000:5, 1500:10 };

// Meta広告等のCPM参考値（¥）
const BENCH_CPM = { 'Meta広告':900, 'YouTube広告':700, 'Twitter広告':600, 'GVAリール':340, 'GVA UGC':280 };

let state = { bgt:1000, tab:'overview' };
let charts = {};

// ───────────────────────────
// ユーティリティ
// ───────────────────────────
const fYenK = v => `¥${Number(v).toLocaleString()}`;
const fImp  = v => v>=10000000?`${(v/10000000).toFixed(1)}千万`:v>=10000?`${(v/10000).toFixed(0)}万`:v.toLocaleString();
const fImpD = v => v>=10000000?`${(v/10000000).toFixed(1)}千万imp`:v>=10000?`${(v/10000).toFixed(0)}万imp`:v.toLocaleString()+'imp';

function calc(bgt){
  const budget   = bgt * 1000;                  // 予算をぴったりの金額に
  const reel     = REEL_COUNT[bgt];
  const reelCost = reel * REEL_UNIT;
  const ugcBudget= budget - reelCost;           // 残額をまるごとUGCへ
  const ugc      = Math.min(Math.floor(ugcBudget / UGC_UNIT), MAX_PEOPLE - reel);
  const ugcCost  = ugcBudget;                   // 合計=予算ぴったり（管理費込み）
  const total    = reel + ugc;
  const imp      = reel*REEL_IMP + ugc*UGC_IMP;
  const cpm      = Math.round(budget/imp*1000);
  const reelPct  = Math.round(reelCost/budget*100);
  return{reel,ugc,reelCost,ugcCost,total,cost:budget,imp,cpm,
    reelPct,ugcPct:100-reelPct,
    costPerPerson:Math.round(budget/total)};
}

// ───────────────────────────
// 数値カウントアップ
// ───────────────────────────
function countUp(el,target,duration=700,prefix='',suffix=''){
  const start=performance.now();
  const isFloat=(target%1!==0);
  function frame(now){
    const p=Math.min((now-start)/duration,1);
    const ease=1-Math.pow(1-p,3);
    const v=target*ease;
    el.textContent=prefix+(isFloat?v.toFixed(1):Math.floor(v).toLocaleString())+suffix;
    if(p<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ───────────────────────────

// ───────────────────────────
function destroyAll(){
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});
  charts={};
}

</div>

function drawCharts(){
  const c=calc(state.bgt);
  const tab=state.tab;

  // シミュレーションタブのチャート
  if(tab==='sim'){
    // ドーナツ
    if(document.getElementById('chart-donut')){
      charts.donut=new Chart(document.getElementById('chart-donut'),{
        type:'doughnut',
        data:{
          labels:['① インフルエンサーリール','② UGC フィード'],
          datasets:[{
            data:[c.reelCost,c.ugcCost],
            backgroundColor:['#d4a017','#15803d'],
            borderColor:['#fff','#fff'],
            borderWidth:3,
            hoverOffset:8
          }]
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{
            legend:{position:'bottom',labels:{font:{size:11},padding:12}},
            tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${(ctx.raw/10000).toFixed(1)}万円`}}
          },
          animation:{animateRotate:true,duration:700}
        }
      });
    }
    // インプ積み上げバー
    if(document.getElementById('chart-imp')){
      charts.imp=new Chart(document.getElementById('chart-imp'),{
        type:'bar',
        data:{
          labels:['インプレッション内訳'],
          datasets:[
            {label:'① リール',data:[c.reel*REEL_IMP],backgroundColor:'rgba(212,160,23,0.85)',borderRadius:4},
            {label:'② UGC フィード',data:[c.ugc*UGC_IMP],backgroundColor:'rgba(21,128,61,0.85)',borderRadius:4}
          ]
        },
        options:{
          indexAxis:'y',responsive:true,maintainAspectRatio:false,
          scales:{
            x:{stacked:true,ticks:{callback:v=>fImp(v)},grid:{color:'rgba(0,0,0,0.05)'}},
            y:{stacked:true,display:false}
          },
          plugins:{
            legend:{position:'bottom',labels:{font:{size:11}}},
            tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fImp(ctx.raw)}imp`}}
          },
          animation:{duration:700}
        }
      });
    }
    // CPM比較バー
    if(document.getElementById('chart-cpm')){
      const labels=Object.keys(BENCH_CPM);
      const data=Object.values(BENCH_CPM);
      const colors=labels.map(l=>l.startsWith('GVA')?'rgba(21,128,61,0.85)':'rgba(100,116,139,0.6)');
      charts.cpm=new Chart(document.getElementById('chart-cpm'),{
        type:'bar',
        data:{labels,datasets:[{
          label:'CPM（¥）',data,backgroundColor:colors,borderRadius:4
        }]},
        options:{
          responsive:true,maintainAspectRatio:false,
          scales:{
            y:{ticks:{callback:v=>`¥${v}`},grid:{color:'rgba(0,0,0,0.05)'}},
            x:{grid:{display:false}}
          },
          plugins:{
            legend:{display:false},
            tooltip:{callbacks:{label:ctx=>`¥${ctx.raw}`}}
          },
          animation:{duration:700}
        }
      });
    }
  }

  // KPIタブ: 時系列チャート
  if(tab==='kpi'&&document.getElementById('chart-timeline')){
    const months=['M1','M2','M3','M4','M5','M6'];
    const reelData=[c.reel*REEL_IMP*0.8,c.reel*REEL_IMP,c.reel*REEL_IMP*1.1,c.reel*REEL_IMP*1.15,c.reel*REEL_IMP*1.2,c.reel*REEL_IMP*1.3];
    const ugcData=[c.ugc*UGC_IMP*0.6,c.ugc*UGC_IMP*0.85,c.ugc*UGC_IMP,c.ugc*UGC_IMP*1.1,c.ugc*UGC_IMP*1.2,c.ugc*UGC_IMP*1.35];
    charts.timeline=new Chart(document.getElementById('chart-timeline'),{
      type:'line',
      data:{
        labels:months,
        datasets:[
          {label:'① リール',data:reelData,borderColor:'#d4a017',backgroundColor:'rgba(212,160,23,0.1)',tension:.4,fill:true,pointRadius:4},
          {label:'② UGC口コミ（累積効果）',data:ugcData,borderColor:'#15803d',backgroundColor:'rgba(21,128,61,0.1)',tension:.4,fill:true,pointRadius:4}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        scales:{
          y:{ticks:{callback:v=>fImp(v)},grid:{color:'rgba(0,0,0,0.05)'}},
          x:{grid:{display:false}}
        },
        plugins:{
          legend:{position:'bottom',labels:{font:{size:11}}},
          tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fImp(ctx.raw)}imp`}}
        },
        animation:{duration:800}
      }
    });
  }

  // 実績タブ: カウントアップ
  if(tab==='result'){
    setTimeout(()=>{
      const animate=(id,v,s='')=>{const el=document.getElementById(id);if(el)countUp(el,v,700,'',s)};
      animate('cv-imp1',340936,'');
      animate('cv-ugc',107,'件');
      animate('cv-maxipm',52000,'');
      animate('cv-x',60,'倍');
      animate('cv-ig',4,'倍');
      const d=document.getElementById('cv-mult');if(d){d.textContent='×8倍';}
      const s=document.getElementById('cv-sales');if(s){s.textContent='1.2倍';}
      const r=document.getElementById('cv-rank');if(r){r.textContent='1位';}
    },200);
  }
}

  const c=calc(state.bgt);
  const el=document.getElementById('bgt-summary');
  if(el) el.innerHTML=`選択中：<strong>¥${state.bgt/10}万円</strong>　合計 <strong>${c.total}名</strong>　推定 <strong>${fImpD(c.imp)}</strong>`;
}

// ───────────────────────────
// 初期化
// ───────────────────────────
function init(){
  const d=new Date();
  document.getElementById('hdr-date').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

  document.querySelectorAll('.bgt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.bgt=+btn.dataset.bgt;
      document.querySelectorAll('.bgt-btn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      updateSummary();
      if(state.tab==='sim') render();
    });
    if(+btn.dataset.bgt===state.bgt) btn.classList.add('on');
  });

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.tab=btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      render();
    });
    if(btn.dataset.tab===state.tab) btn.classList.add('on');
  });

  updateSummary();
  render();
}

init();
</script>
</body>
</html>
